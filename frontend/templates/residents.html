
<!DOCTYPE html>
<html>
<head>
    <title>Resident Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>Resident Management</h1>
    <p>Register and manage apartment residents</p>
</header>

<div class="container">
    <div class="card">
        <h2>Add Resident</h2>

        <form method="POST">
            <input type="text" name="name" placeholder="Resident Name" required>
            <br><br>

            <input type="text" name="apartment" placeholder="Apartment Number" required>
            <br><br>

            <input type="text" name="phone" placeholder="Phone Number" required>
            <br><br>

            <button type="submit">Add Resident</button>
        </form>
    </div>

    <div class="card">
        <h2>Resident List</h2>

        {% for resident in residents %}
            <p>
                {{ resident.name }} |
                {{ resident.apartment_number }} |
                {{ resident.phone }}
            </p>
        {% else %}
            <p>No residents registered yet.</p>
        {% endfor %}
    </div>
</div>

</body>
</html>
